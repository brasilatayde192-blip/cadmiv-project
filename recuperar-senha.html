<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CADMIV — Esqueci minha senha</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f4f9;color:#2c3e50;margin:0;padding:24px}main{max-width:440px;margin:30px auto;background:white;padding:28px;border-radius:10px;box-shadow:0 4px 10px #0001}h1{font-size:24px}label{display:block;margin-top:18px;font-weight:bold}input,button{width:100%;padding:12px;margin-top:7px;border-radius:5px;border:1px solid #bdc3c7}button{background:#2980b9;color:white;font-weight:bold;margin-top:22px;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.5}a{color:#246894}#mensagem{font-weight:bold;overflow-wrap:anywhere}</style><script src="senha.js" defer></script></head><body><main><h1 style="font:700 32px Arial,sans-serif;color:#111;margin:0 0 24px">CADMIV</h1><h2>Esqueci minha senha</h2><p id="mensagem" role="status" aria-live="polite"></p><p>Informe o telefone e o e-mail usados no cadastro. Enviaremos um link para criar uma nova senha.</p><form id="recuperar-senha" method="post" action="/api/senha/solicitar"><label for="telefone">Telefone com DDD</label><input id="telefone" name="telefone" type="tel" autocomplete="tel" maxlength="30" required><label for="email">E-mail cadastrado</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><button type="submit">Solicitar link de recuperação</button></form><p>Não tem mais acesso ao e-mail cadastrado? A recuperação automática depende do acesso a essa caixa de e-mail.</p><p><a href="login.html">Voltar ao acesso</a></p></main></body></html>
