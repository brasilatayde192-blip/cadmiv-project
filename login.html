<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>CADMIV - Login de Segurança Privado</title> 
    <style> 
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; color: #2c3e50; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; } 
        .login-container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: left; box-sizing: border-box; } 
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; } 
        p { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; } 
        label { font-weight: bold; display: block; margin-top: 15px; color: #34495e; } 
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-size: 14px; } 
        .form-group { position: relative; display: flex; align-items: center; }
        .btn-login { background-color: #2980b9; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 25px; cursor: pointer; } 
        .btn-login:hover { background-color: #2471a3; } 
        .footer-text { text-align: center; margin-top: 20px; font-size: 12px; color: #bdc3c7; } 
        .alert-box { background-color: #fadbd8; border-left: 5px solid #e74c3c; color: #78281f; padding: 15px; border-radius: 5px; margin-top: 15px; display: none; font-weight: bold; font-size: 13px; text-align: center; }
    </style> 
    <script> 
        function alternarVisibilidadeSenha() { 
            var campoSenha = document.getElementById('login_senha'); 
            var iconeOlho = document.getElementById('icone_olho'); 
            if (campoSenha.type === 'password') { 
                campoSenha.type = 'text'; 
                iconeOlho.innerText = '👁️'; 
            } else { 
                campoSenha.type = 'password'; 
                iconeOlho.innerText = '🙈'; 
            } 
        }

        function realizarLogin() { 
            var telefone = document.getElementById("login_telefone").value; 
            var shadowSenha = document.getElementById("login_senha").value; 
            var alertaBox = document.getElementById("alerta-login");

            if (telefone === "" || shadowSenha === "") { 
                alert("Por favor, preencha todos os campos obrigatórios."); 
                return; 
            } 

            // CIRCUITO DE VALIDAÇÃO: Simula teste de segurança corporativa
            if (shadowSenha === "123456" || shadowSenha === "admin" || shadowSenha.length >= 4) {
                alertaBox.style.display = "none";
                alert("Acesso autorizado! Entrando no formulário CADMIV."); 
                window.location.href = "cadastro.html"; // Redirecionamento corrigido!
            } else {
                // Ativa a recusa na tela caso a senha seja considerada inválida/falsa
                alertaBox.style.display = "block";
            }
        } 
    </script> 
</head> 
<body> 
    <div class="login-container"> 
        <h2>Acesso ao seu Cadastro na CADMIV</h2> 
        <p>Insira seu Telefone e sua Senha de Acesso.</p> 
        
        <!-- Alerta de recusa profissional -->
        <div id="alerta-login" class="alert-box">❌ ACESSO NEGADO:<br>Senha ou credenciais incorretas ou inválidas!</div>

        <form onsubmit="event.preventDefault(); realizarLogin();"> 
            <label>Telefone Celular (Com DDD):</label> 
            <input type="text" id="login_telefone" placeholder="Ex: 11999998888" required> 
            
            <label>Senha de Acesso:</label> 
            <div class="form-group">
                <input type="password" id="login_senha" placeholder="Digite sua senha" required style="padding-right: 45px;"> 
                <button type="button" onclick="alternarVisibilidadeSenha()" id="icone_olho" style="position: absolute; right: 10px; background: none; border: none; font-size: 18px; cursor: pointer; color: #7f8c8d; padding: 5px; top: 8px;">🙈</button> 
            </div>

            <button type="submit" class="btn-login">Entrar no Sistema de Cadastro</button> 
        </form> 
        <div class="footer-text">Plataforma sob Conformidade de Proteção Privado.</div> 
    </div> 
</body> 
</html>
