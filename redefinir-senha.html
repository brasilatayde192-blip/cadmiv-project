<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CADMIV — Criar nova senha</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f4f9;color:#2c3e50;margin:0;padding:24px}main{max-width:440px;margin:30px auto;background:white;padding:28px;border-radius:10px;box-shadow:0 4px 10px #0001}h1{font-size:24px}label{display:block;margin-top:18px;font-weight:bold}input,button{width:100%;padding:12px;margin-top:7px;border-radius:5px;border:1px solid #bdc3c7}button{background:#2980b9;color:white;font-weight:bold;margin-top:22px;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.5}a{color:#246894}#mensagem{font-weight:bold;overflow-wrap:anywhere}</style><script src="senha.js" defer></script></head><body><main><h1>Criar nova senha</h1><p id="mensagem" role="status" aria-live="polite"></p><p>Escolha uma senha exclusiva de 12 a 128 caracteres. Após a troca, será necessário entrar novamente nos seus dispositivos.</p><form id="redefinir-senha" method="post" action="/api/senha/redefinir"><label for="senha">Nova senha</label><input id="senha" name="senha" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirmacao">Repita a nova senha</label><input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="submit">Salvar nova senha</button></form><p id="entrar" hidden><a href="login.html">Entrar com a nova senha</a></p><p><a href="recuperar-senha.html">Solicitar outro link</a></p></main></body></html>
