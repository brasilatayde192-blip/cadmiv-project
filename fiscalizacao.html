<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADMIV - Portal de Fiscalização Nacional</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; color: #2c3e50; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 550px; text-align: left; box-sizing: border-box; }
        h2 { text-align: center; color: #34495e; }
        p { text-align: center; font-size: 14px; color: #7f8c8d; }
        
        .police-section { background-color: #eaeded; border: 2px solid #34495e; padding: 25px; border-radius: 10px; margin-top: 10px; }
        .police-title { background-color: #34495e; color: white; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; font-size: 16px; }
        
        label { font-weight: bold; display: block; margin-top: 15px; color: #34495e; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #34495e; border-radius: 5px; box-sizing: border-box; font-size: 14px; font-weight: bold; text-align: center; }
        
        .police-btn { background-color: #34495e; color: white; border: none; padding: 14px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 15px; cursor: pointer; text-transform: uppercase; }
        .police-btn:hover { background-color: #2c3e50; }
        
        .status-result { display: none; margin-top: 20px; padding: 20px; border-radius: 5px; text-align: center; font-weight: bold; font-size: 15px; line-height: 1.4; }
        
        /* 🚨 ALERTA DE FURTO VERMELHO E PULSANTE */
        .status-alert-furto { background-color: #c0392b; color: white; border: 3px solid #78281f; animation: pulsar 1s infinite alternate; }
        
        @keyframes pulsar {
            0% { background-color: #c0392b; box-shadow: 0 0 10px #c0392b; }
            100% { background-color: #ec7063; box-shadow: 0 0 25px #ec7063; }
        }

        .web-footer-center { font-size: 16px; font-weight: bold; color: #2c3e50; text-align: center; margin-top: 25px; }
    </style>
    <script>
        // MÁGICA QUE MUDA O TEXTO DA CAIXINHA DE ACORDO COM A SUA ESCOLHA
        function mudarFormularioBusca() {
            var tipo = document.getElementById("tipo_busca").value;
            var caixaTexto = document.getElementById("input_agente");
            
            if (tipo === "chassi") {
                caixaTexto.placeholder = "DIGITE O NÚMERO DO CHASSI PARA CHECAGEM";
            } else {
                caixaTexto.placeholder = "DIGITE O NOME OU CPF DO PROPRIETÁRIO";
            }
        }

        // MOTOR INTELIGENTE DE DUPLA CHECAGEM CRIADO POR VOCÊ
        function consultarAgente() {
            var tipo = document.getElementById("tipo_busca").value;
            var valor = document.getElementById("input_agente").value.trim();
            var resultado = document.getElementById("resultado_consulta");
            
            if (valor === "") {
                alert("Agente, por favor insira os dados para fiscalização.");
                return;
            }

            resultado.style.display = "block";

            // Se o guarda escolheu checar pelo veículo (Chassi)
            if (tipo === "chassi") {
                if (valor === "1234" || valor.toLowerCase() === "furto") {
                    resultado.className = "status-result status-alert-furto";
                    resultado.innerHTML = "🚨 🚨 ALERTA DE EMERGÊNCIA POLICIAL 🚨 🚨<br><br>" +
                                          "STATUS: VEÍCULO FURTADO / ROUBADO!<br>" +
                                          "MOTIVO: Cadastro bloqueado pelo proprietário legítimo.<br>" +
                                          "⚠️ ABORDE O CONDUTOR E ACIONE A POLÍCIA MILITAR IMEDIATAMENTE!";
                } else if (valor === "5555") {
                    resultado.className = "status-result";
                    resultado.style.backgroundColor = "#fadbd8";
                    resultado.style.color = "#78281f";
                    resultado.style.border = "2px solid #e74c3c";
                    resultado.innerHTML = "🔴 STATUS: DESATIVADO<br>Motivo: Veículo Repassado via Venda / Doação / Fora de Uso.";
                } else if (valor === "7777") {
                    resultado.className = "status-result";
                    resultado.style.backgroundColor = "#fdebd0";
                    resultado.style.color = "#7e5109";
                    resultado.style.border = "2px solid #f39c12";
                    resultado.innerHTML = "💛 STATUS: ADORMECIDO<br>Motivo: Falta fazer a Renovação Anual do Cadastro CADMIV.";
                } else {
                    resultado.className = "status-result";
                    resultado.style.backgroundColor = "#d4efdf";
                    resultado.style.color = "#196f3d";
                    resultado.style.border = "2px solid #27ae60";
                    resultado.innerHTML = "🟢 STATUS: ATIVO (OK)<br>Veículo Regularizado sob Proteção Nacional da CADMIV.";
                }
            } 
            // Se o guarda escolheu a 2ª checagem (Dados Pessoais do Cliente)
            else {
                resultado.className = "status-result";
                resultado.style.backgroundColor = "#ebf5fb";
                resultado.style.color = "#21618c";
                resultado.style.border = "2px solid #2980b9";
                resultado.innerHTML = "👤 2ª LINHA DE DEFESA - DADOS DO PROPRIETÁRIO:<br><br>" +
                                      "NOME REGISTRADO: Carlos Henrique da Silva<br>" +
                                      "STATUS DO DONO: Regularizado e Sem Pendências.<br>" +
                                      "📋 NOTA DE SEGURANÇA: Caso o condutor abordado não seja a pessoa acima, exija imediatamente um Documento Original com Foto (RG ou CNH) para comprovação de boa conduta.";
            }
        }
    </script>
</head>
<body>

    <div class="container">
        <h2>Portal de Fiscalização Rodoviária</h2>
        <p>Uso estrito e exclusivo das autoridades de segurança pública nacional.</p>

        <div class="police-section">
            <div class="police-title">👮‍♂️ CONSULTA INTEGRADA CADMIV</div>
            
            <label>Selecione o Tipo de Checagem:</label>
            <select id="tipo_busca" onchange="mudarFormularioBusca()">
                <option value="chassi">1ª Checagem: Status do Veículo (Chassi / Série)</option>
                <option value="pessoais">2ª Checagem: Dados Pessoais do Proprietário</option>
            </select>

            <label>Insira os Dados para Varredura:</label>
            <input type="text" id="input_agente" placeholder="DIGITE O NÚMERO DO CHASSI PARA CHECAGEM">
            
            <button type="button" onclick="consultarAgente()" class="police-btn">🔍 Executar Checagem de Segurança</button>
            
            <div id="resultado_consulta" class="status-result"></div>
        </div>

        <div class="web-footer-center">://cadmiv.com.br</div>
    </div>

</body>
</html>
