<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADMIV - Pagamento e Identificação Pessoal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; color: #2c3e50; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; width: 100%; max-width: 550px; box-sizing: border-box; text-align: left; }
        h2 { color: #27ae60; text-align: center; }
        p { text-align: center; }
        .pix-box { background-color: #e8f8f5; border: 2px solid #27ae60; padding: 20px; border-radius: 10px; margin-top: 20px; text-align: center; }
        .qr-placeholder { background-color: #eaeded; width: 200px; height: 200px; margin: 20px auto; display: flex; align-items: center; justify-content: center; border: 2px dashed #bdc3c7; font-weight: bold; color: #7f8c8d; }
        .btn-confirm { background-color: #2980b9; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; font-size: 16px; margin-top: 25px; cursor: pointer; text-decoration: none; display: block; box-sizing: border-box; text-align: center; }
        .btn-confirm:hover { background-color: #2471a3; }
        
        .photo-section { background-color: #fcf3cf; border: 1px dashed #f39c12; padding: 20px; border-radius: 5px; margin-top: 20px; }
        .dependent-box { background: white; border: 1px solid #f39c12; padding: 15px; border-radius: 5px; margin-top: 15px; }
        .upload-btn { background-color: #f39c12; color: white; padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-block; margin-top: 10px; margin-right: 10px; }
        .camera-btn { background-color: #d35400; color: white; padding: 10px 15px; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-block; margin-top: 10px; }
        video { width: 100%; max-width: 200px; display: none; margin-top: 10px; border-radius: 5px; background: black; }
    </style>
    
<script src="cliente.js" defer></script></head>
<body>

    <div class="container">
        <div class="head-title"><h1>CADMIV</h1></div>
        <h2>Portal de Pagamento <br>e<br> Identificação</h2>
        <p>Confira os dados salvos na sua conta.</p>

        <!-- SEÇÃO DE FOTOS E RECONHECIMENTO VISUAL -->
        <!-- ÁREA DO PIX PREPARADA -->
        <div class="pix-box"><strong>Cadastro salvo — ativação pendente</strong><p>O pagamento PIX ainda não está integrado. Nenhuma cobrança ou ativação é realizada nesta etapa.</p></div>

        <button type="button" onclick="finalizarProcesso()" class="btn-confirm">Consultar meus dados</button>
    </div>

</body>
</html>
